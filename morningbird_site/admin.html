<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Bird — Blog Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="bird">◜</span><span><b>Morning Bird</b><small>BLOG ADMIN</small></span></a><nav><a href="blog.html">View Blog</a><a href="index.html">Website</a></nav></header><main class="section paper"><div class="section-label">CONTENT MANAGEMENT</div><div><h1 style="font-size:52px;color:var(--navy);margin-bottom:12px">Manage Journal</h1><p style="color:var(--muted)">Demo content manager. Posts are stored in this browser using localStorage. Connect this interface to a secure database/authentication before production.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:35px"><form id="form" style="background:white;padding:30px;border:1px solid var(--line)"><input type="hidden" id="editSlug"><label>Title<input id="title" required style="display:block;width:100%;padding:12px;margin:6px 0 18px"></label><label>Category<select id="cat" style="display:block;width:100%;padding:12px;margin:6px 0 18px"><option>Motor Insurance</option><option>Health Insurance</option><option>Property & Home</option><option>SME & Business</option><option>Travel</option><option>Agriculture</option><option>Insurance Education</option></select></label><label>Excerpt<textarea id="excerpt" required rows="3" style="display:block;width:100%;padding:12px;margin:6px 0 18px"></textarea></label><label>Article content<textarea id="content" required rows="10" placeholder="One paragraph per line" style="display:block;width:100%;padding:12px;margin:6px 0 18px"></textarea></label><button class="btn btn-dark" type="submit">Save Article</button><button class="btn" type="button" onclick="resetForm()">Clear</button><p id="status" style="color:var(--gold)"></p></form><div><h2 style="font-size:34px">Published & draft articles</h2><div id="admin-list" style="margin-top:20px"></div></div></div></div></main><script>
const seeds=[{slug:'choosing-motor-cover-kenya',title:'How to choose the right motor insurance cover in Kenya',category:'Motor Insurance',date:'2026-09-02',readTime:'5 min read',excerpt:'Third-party, third-party fire and theft, or comprehensive — understand what each option is designed to protect.',content:['Every driver needs at least the legally required third-party protection.','Before buying, compare benefits, exclusions, excess and claims requirements — not just price.']},{slug:'travel-insurance-what-it-covers',title:'Travel insurance: what your policy actually covers',category:'Travel',date:'2026-08-19',readTime:'4 min read',excerpt:'A plain-language guide to common travel protections.',content:['Travel policies commonly combine emergency medical, cancellation, curtailment and baggage protections.']}];function posts(){try{return JSON.parse(localStorage.getItem('mb_posts'))||seeds}catch{return seeds}}function save(x){localStorage.setItem('mb_posts',JSON.stringify(x))}function render(){document.getElementById('admin-list').innerHTML=posts().map(p=>`<div style="padding:18px 0;border-bottom:1px solid var(--line)"><b>${p.title}</b><p style="margin:5px 0;color:var(--muted)">${p.category} · ${p.date||'draft'}</p><button onclick="edit('${p.slug}')">Edit</button> <button onclick="del('${p.slug}')">Delete</button></div>`).join('')}function edit(slug){const p=posts().find(x=>x.slug===slug);if(!p)return;editSlug.value=p.slug;title.value=p.title;cat.value=p.category;excerpt.value=p.excerpt;content.value=(p.content||[]).join('\n')}function del(slug){if(confirm('Delete this article?')){save(posts().filter(p=>p.slug!==slug));render()}}function resetForm(){document.getElementById('form').reset();editSlug.value=''}document.getElementById('form').onsubmit=e=>{e.preventDefault();let arr=posts(),slug=editSlug.value||title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const obj={slug,title:title.value,category:cat.value,date:new Date().toISOString().slice(0,10),readTime:'5 min read',excerpt:excerpt.value,content:content.value.split('\n').filter(Boolean)};const i=arr.findIndex(p=>p.slug===slug);if(i>=0)arr[i]=obj;else arr.unshift(obj);save(arr);status.textContent='Article saved.';resetForm();render()};render();
</script></body></html>
